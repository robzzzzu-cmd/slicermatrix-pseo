name: Daily pSEO Slicer Profile Drip

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pseo-drip-and-deploy"
  cancel-in-progress: false

jobs:
  generate-daily-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Batch of 50 Slicer Profiles via Gemini 3.8 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: node scripts/generate-batch.mjs

      - name: Commit and Push Generated Profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seeds.json src/data/pages/
          if git diff --staged --quiet; then
            echo "No new profiles generated in this run."
          else
            git commit -m "chore(pseo): generate daily batch of OrcaSlicer profiles"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Static Site with Newly Generated Profiles
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-daily-profiles
    steps:
      - name: Deploy Updated Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
