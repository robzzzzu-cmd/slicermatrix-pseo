name: Daily pSEO Slicer Profile Drip

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Batch of 50 Slicer Profiles via Gemini 3.8 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: node scripts/generate-batch.mjs

      - name: Verify Static Build Integrity
        run: npm run build

      - name: Commit and Push Generated Profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seeds.json src/data/pages/
          if git diff --staged --quiet; then
            echo "No new profiles generated in this run."
          else
            git commit -m "chore(pseo): generate daily batch of OrcaSlicer profiles"
            git push
          fi
